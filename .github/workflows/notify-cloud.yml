name: Notify Cloud of backend image

on:
  workflow_run:
    workflows: [Publish backend image]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.name == 'Publish backend image' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == '100-hours-a-week/KTB4-14th-BE'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Cloud staging workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CLOUD_WORKFLOW_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api --method POST repos/100-hours-a-week/KTB4-14th-Cloud/actions/workflows/backend-staging.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$RUN_ID" -f "inputs[run_attempt]=$RUN_ATTEMPT" > /dev/null

      - name: Record notification result
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          {
            echo '### Cloud staging notification'
            echo "- Publish source SHA: \`${SOURCE_SHA}\`"
            echo "- Publish run: \`${RUN_ID}\`, attempt: \`${RUN_ATTEMPT}\`"
            echo "- Dispatch result: \`${DISPATCH_OUTCOME}\`"
            echo 'This reports dispatch acceptance only; Cloud processing and staging Sync completion are separate.'
          } >> "$GITHUB_STEP_SUMMARY"
