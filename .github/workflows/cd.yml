name: Backend Production CD

on:
  # main 반영만으로 자동 배포하지 않고 Cloud 담당자가 직접 실행
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (예: v1.0.0)'
        required: true
        type: string

concurrency:
  # 운영 배포는 한 번에 하나만 실행하며 진행 중인 배포를 새 실행으로 취소하지 않음
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # GitHub OIDC Token을 발급받아 AWS IAM Role을 Assume하기 위한 권한
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    env:
      # Commit SHA를 변경 불가능한 이미지 식별자로 사용
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Checkout 이후 Git 인증 정보가 Runner에 남지 않도록 설정

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ARM64 이미지 빌드 및 Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          # 같은 이미지에 Source 추적용 SHA Tag와 사람이 읽는 Release Tag를 함께 지정
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.DOCKERHUB_IMAGE }}:${{ inputs.version }}

      - name: GitHub OIDC로 AWS 인증
        # v6: 현재 configure-aws-credentials의 최신 major 버전이며 OIDC 인증을 지원
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-cd-${{ github.run_id }}

      - name: Task Definition에 신규 이미지 반영
        id: task-definition
        # Task Definition Family의 최신 Revision을 가져와 지정 Container의 Image만 변경
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: ECS Service 배포
        # 렌더링된 Task Definition을 새 Revision으로 등록하고 ECS Service를 업데이트
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          # Service 업데이트 요청 후 바로 끝내지 않고 ECS가 안정 상태가 될 때까지 대기
          # 신규 Task 기동 실패 시 ECS Circuit Breaker와 자동 Rollback은 ECS가 수행
          wait-for-service-stability: true
          # 안정 상태를 확인하는 Polling 사이의 최대 대기 간격을 15초로 제한
          wait-max-delay-seconds: 15

      - name: 공개 Health Check
        # ECS 안정화 후 GitHub Runner에서 실제 외부 접근 경로를 한 번 더 확인
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.BACKEND_HEALTH_URL }}"