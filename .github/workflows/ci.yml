name: PR CI

on:
  pull_request:
    branches: [development]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # ARM64 이미지를 직접 빌드하므로 QEMU 에뮬레이션이 불필요
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # checkout 이후 Git 명령용 인증 정보를 유지하지 않음

      - name: 도커 빌드 환경 세팅
        uses: docker/setup-buildx-action@v4

      - name: 도커 이미지 빌드 테스트 실행
        # Dockerfile에 정의된 빌드 수행
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64 # 결과 이미지의 대상 OS와 CPU 구조
          push: false
          tags: audigo-backend:ci-test
