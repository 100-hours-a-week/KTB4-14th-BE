name: Publish backend image

on:
  push:
    branches: [main]

concurrency:
  group: backend-publish-image-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create candidate record
        id: candidate
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Image digest is missing or invalid.' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || -z "$IMAGE_REPOSITORY" ]]; then
            echo 'Source SHA or image repository is invalid.' >&2
            exit 1
          fi
          artifact_name="image-candidate-${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          jq -n \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_tag "sha-${SOURCE_SHA}" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            '{schema_version: 1, source_repository: $source_repository, source_sha: $source_sha,
              source_ref: $source_ref, image_repository: $image_repository, image_tag: $image_tag,
              image_digest: $image_digest, platform: "linux/arm64", workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt, workflow_run_url: $run_url}' > image-candidate.json
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload candidate record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: image-candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize published image
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          {
            echo '### Published image candidate'
            echo "- Image: \`${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Candidate artifact: \`${ARTIFACT_NAME}\`"
            echo "- [Build run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
