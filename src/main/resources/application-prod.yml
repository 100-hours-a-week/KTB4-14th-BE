spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # DB 주소는 ProxySQL로 고정한다. 컷오버 시에는 ProxySQL의 목적지만 변경한다
    # 예: jdbc:mysql://<proxysql-host>:6033/audigo?useLocalSessionState=true&useLocalTransactionState=true&cacheServerConfiguration=true
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

audigo:
  cors:
    allowed-origins: ${AUDIGO_CORS_ALLOWED_ORIGINS}

  auth:
    jwt-secret: ${AUDIGO_JWT_SECRET}

  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
