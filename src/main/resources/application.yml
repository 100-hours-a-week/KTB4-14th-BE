server:
  port: 8080

spring:
  application:
    name: audigo-be
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

  data:
    redis:
      host: ${AUDIGO_REDIS_HOST:localhost}
      port: ${AUDIGO_REDIS_PORT:6379}
      username: ${AUDIGO_REDIS_USERNAME:}
      password: ${AUDIGO_REDIS_PASSWORD:}
      ssl:
        enabled: ${AUDIGO_REDIS_SSL_ENABLED:false}
      connect-timeout: ${AUDIGO_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${AUDIGO_REDIS_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health

audigo:
  cors:
    allowed-origins: ${AUDIGO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    presence:
      renewal-interval: ${AUDIGO_CHAT_PRESENCE_RENEWAL_INTERVAL:15s}
      lease-duration: ${AUDIGO_CHAT_PRESENCE_LEASE_DURATION:45s}
      key-ttl: ${AUDIGO_CHAT_PRESENCE_KEY_TTL:90s}
  auth:
    access-token-ttl-seconds: ${AUDIGO_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${AUDIGO_REFRESH_TOKEN_TTL_SECONDS:1209600}
    jwt-secret: ${AUDIGO_JWT_SECRET:audigo-local-development-secret-key-change-me}
    cookie:
      access-token-name: ${AUDIGO_ACCESS_TOKEN_COOKIE_NAME:audigo_access_token}
      refresh-token-name: ${AUDIGO_REFRESH_TOKEN_COOKIE_NAME:audigo_refresh_token}
      http-only: true
      secure: ${AUDIGO_COOKIE_SECURE:false}
      same-site: ${AUDIGO_COOKIE_SAME_SITE:Lax}
      path: /
  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/kakao}

  kakao:
    map:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      place-detail-base-url: ${KAKAO_PLACE_DETAIL_BASE_URL:https://place.map.kakao.com}
    transit:
      base-url: ${KAKAO_TRANSIT_BASE_URL:https://apis-navi.kakaomobility.com/affiliate/publictransit/v1/multimodal/directions}
      rest-api-key: ${KAKAO_REST_API_KEY:}

  transit-arrival:
    tago:
      base-url: ${TAGO_BUS_ARRIVAL_BASE_URL:https://apis.data.go.kr/1613000/ArvlInfoInqireService/getSttnAcctoArvlPrearngeInfoList}
      service-key: ${TAGO_SERVICE_KEY:}
  transit-stop:
    tago:
      base-url: ${TAGO_BUS_STOP_BASE_URL:https://apis.data.go.kr/1613000/BusSttnInfoInqireService}
      service-key: ${TAGO_SERVICE_KEY:}

  ai:
    base-url: ${AUDIGO_AI_BASE_URL:}
    sse-path: ${AUDIGO_AI_SSE_PATH:/api/ai/v1/itinerary-jobs/stream}
    api-token: ${AUDIGO_API_TOKEN:}
    connect-timeout-seconds: ${AUDIGO_AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AUDIGO_AI_READ_TIMEOUT_SECONDS:330}
    job-timeout-seconds: ${AUDIGO_AI_JOB_TIMEOUT_SECONDS:300}
    matching:
      candidates-path: ${AUDIGO_AI_MATCHING_CANDIDATES_PATH:/api/ai/v1/matches/candidates}
      mock-enabled: ${AUDIGO_AI_MATCHING_MOCK_ENABLED:false}
      candidate-limit: ${AUDIGO_AI_MATCHING_CANDIDATE_LIMIT:3}
  sqs:
    enabled: ${AUDIGO_SQS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    job-queue-url: ${AUDIGO_AI_JOB_QUEUE_URL:}
    result-queue-url: ${AUDIGO_AI_RESULT_QUEUE_URL:}
    endpoint: ${AUDIGO_SQS_ENDPOINT:}
    outbox:
      publisher-delay-millis: ${AUDIGO_SQS_OUTBOX_PUBLISHER_DELAY_MILLIS:1000}
      batch-size: ${AUDIGO_SQS_OUTBOX_BATCH_SIZE:10}
      retry-base-delay-seconds: ${AUDIGO_SQS_OUTBOX_RETRY_BASE_DELAY_SECONDS:5}
      retry-max-delay-seconds: ${AUDIGO_SQS_OUTBOX_RETRY_MAX_DELAY_SECONDS:300}
      processing-lease-seconds: ${AUDIGO_SQS_OUTBOX_PROCESSING_LEASE_SECONDS:120}
    result-consumer:
      poller-delay-millis: ${AUDIGO_SQS_RESULT_POLLER_DELAY_MILLIS:1000}
      wait-time-seconds: ${AUDIGO_SQS_RESULT_WAIT_TIME_SECONDS:20}
      max-messages: ${AUDIGO_SQS_RESULT_MAX_MESSAGES:5}
      concurrency: ${AUDIGO_SQS_RESULT_CONCURRENCY:2}
      executor-queue-capacity: ${AUDIGO_SQS_RESULT_EXECUTOR_QUEUE_CAPACITY:20}
      max-receive-count: ${AUDIGO_SQS_RESULT_MAX_RECEIVE_COUNT:5}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:local}
  traces-sample-rate: 0.1
