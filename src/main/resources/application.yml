server:
  port: 8080

spring:
  application:
    name: audigo-be
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health

audigo:
  cors:
    allowed-origins: ${AUDIGO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    access-token-ttl-seconds: ${AUDIGO_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${AUDIGO_REFRESH_TOKEN_TTL_SECONDS:1209600}
    jwt-secret: ${AUDIGO_JWT_SECRET:audigo-local-development-secret-key-change-me}
    cookie:
      access-token-name: ${AUDIGO_ACCESS_TOKEN_COOKIE_NAME:audigo_access_token}
      refresh-token-name: ${AUDIGO_REFRESH_TOKEN_COOKIE_NAME:audigo_refresh_token}
      http-only: true
      secure: ${AUDIGO_COOKIE_SECURE:false}
      same-site: ${AUDIGO_COOKIE_SAME_SITE:Lax}
      path: /
  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/kakao}

  kakao:
    map:
      rest-api-key: ${KAKAO_MAP_REST_API_KEY:}

  ai:
    base-url: ${AUDIGO_AI_BASE_URL:}
    sse-path: ${AUDIGO_AI_SSE_PATH:/api/ai/v1/itinerary-jobs/stream}
    api-token: ${AUDIGO_API_TOKEN:}
    connect-timeout-seconds: ${AUDIGO_AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AUDIGO_AI_READ_TIMEOUT_SECONDS:330}
    job-timeout-seconds: ${AUDIGO_AI_JOB_TIMEOUT_SECONDS:300}
