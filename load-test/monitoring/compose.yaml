services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required (use a pinned Prometheus image)}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_RUNTIME_DIR:-./runtime}/targets:/etc/prometheus/targets:ro

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE is required (use a pinned Grafana image)}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${MONITORING_GRAFANA_PASSWORD:?MONITORING_GRAFANA_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:13000
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
