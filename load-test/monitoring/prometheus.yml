global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: audigo-backend
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/backend.json
        refresh_interval: 5s

  - job_name: audigo-mysql
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mysql.json
        refresh_interval: 5s
