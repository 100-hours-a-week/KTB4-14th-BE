services:
  mysql:
    image: mysql:8.4
    container_name: audigo-mysql
    environment:
      MYSQL_DATABASE: audigo
      MYSQL_USER: audigo
      MYSQL_PASSWORD: audigo
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - audigo-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "127.0.0.1:${AUDIGO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  audigo-mysql-data:
